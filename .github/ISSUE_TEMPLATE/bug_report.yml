name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! **Security issues must not be reported here**:
        see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest template + Java code that shows the problem.
      render: java
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message / code
      description: The Agbale error code (e.g. AGBALE_TEMPLATE_SYNTAX) and message, if any.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Agbale, Java, Spring Boot (if used), OS / Docker image.
      placeholder: Agbale 0.1.0, Java 21, Spring Boot 4.2.0, eclipse-temurin:21-jre
    validations:
      required: true
