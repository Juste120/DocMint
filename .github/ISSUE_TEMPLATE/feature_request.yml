name: Feature request
description: Suggest an idea for DocMint.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [ROADMAP](../blob/main/ROADMAP.md) first: many features are already planned
        for a specific version.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? A code or template example helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
