name: Release

# Manual only. A version published to Maven Central is permanent (constitution, Principle X):
# the full CI runs again first, and the deployment is uploaded WITHOUT auto-publish, so the
# maintainer reviews and publishes it in the Central Portal.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check version format
        run: echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      # Only agbale-bom, agbale-core and agbale-spring-boot-starter are deployed:
      # the examples profile is disabled with -DskipExamples.
      - name: Deploy to Maven Central (validated, not auto-published)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -DskipExamples -Drevision=${{ inputs.version }} -P release deploy
      - name: Tag the release
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
