version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns: ['*-plugin', '*maven*']
  - package-ecosystem: npm
    directory: /docmint-examples/demo-angular
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*']
    ignore:
      # Angular 22 requires TypeScript 6.0.x; the library is a local build, not on npm yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@juste120/docmint-angular'
  - package-ecosystem: npm
    directory: /docmint-angular
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', 'ng-packagr']
    ignore:
      # Angular 22 requires TypeScript 6.0.x.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
