version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns: ['*-plugin', '*maven*']
  - package-ecosystem: npm
    directory: /agbale-examples/demo-angular
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
